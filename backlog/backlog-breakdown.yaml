# YCL backlog breakdown (LAB-5) — source of truth for GitHub issue creation.
# Epic = 機能グループ E-xx (WBS LAB-1) / Issue = Story E-xx-Syy / Sub-issue = task 1–3 days.
# Scope: delta to-be vs as-built of the 18 LAB-4 core screens + shared foundation (ADR / GAP P0-P1).
# refs: DLT-* = LAB4/specs/design/screens/*/spec.md §Delta, GAP-* = LAB4/specs/database/prototype-vs-design-gap.md
# layer: db | api | ui | batch | test   hours: direct bottom-up estimate (8h = 1 day)
# constraint: driver-hours-2024 marks items driven by 改善基準告示 (2024年4月改正) — kept separate on purpose.
# milestones: simulated UAT releases (LAB-5 exercise dates). scope = whole epic ID or single story ID;
#   every story must resolve to exactly one milestone, and depends must not point to a later milestone.

milestones:
  - key: UAT1
    title: UAT 1st (2026/12/01)
    due: 2026-12-01
    description: |
      基盤・認証/権限・マスター・入荷検品・引当ルールエンジン・移行判定
      Nền tảng, xác thực/phân quyền, master, kiểm hàng nhập, engine quy tắc phân bổ, phán định migration
      ※ LAB-5 演習用の仮想日程 / Lịch giả lập cho LAB-5
    scope: [E-24, E-21, E-20, E-23, E-08-S01, E-13-S03, E-02-S01, E-02-S02, E-02-S04, E-02-S06]
  - key: UAT2
    title: UAT 2nd (2027/01/05)
    due: 2027-01-05
    description: |
      一時温度帯・ロット生成・期限/引当・ピッキング・出荷確定・ルート計画とドライバー労働時間（2024 年規制）
      Dải nhiệt tạm thời, tạo lô, hạn dùng/phân bổ, lấy hàng, xác nhận xuất, lập tuyến và giờ làm tài xế (quy định 2024)
      ※ LAB-5 演習用の仮想日程 / Lịch giả lập cho LAB-5
    scope: [E-02-S03, E-02-S05, E-06, E-08-S02, E-09, E-11, E-12, E-22-S02]
  - key: UAT3
    title: UAT 3rd (2027/02/02)
    due: 2027-02-02
    description: |
      配送完了（POD オフライン）・温度ロガー/アラーム/逸脱・ロット隔離・トレース・回収・監査エビデンス・メール通知
      Hoàn tất giao (POD ngoại tuyến), logger nhiệt/cảnh báo/sai lệch, cách ly lô, truy xuất, thu hồi, bằng chứng kiểm toán, email
      ※ LAB-5 演習用の仮想日程 / Lịch giả lập cho LAB-5
    scope: [E-02-S07, E-03, E-10, E-13-S01, E-13-S02, E-13-S04, E-14, E-16, E-17, E-19, E-22-S03]

# sprints: 2-week iterations (Project field "Iteration"); each milestone is built in the two sprints
#   before its UAT date. Tasks are placed and backend PICs balanced by backlog_sprint_planner.py.
sprint_duration_days: 14
sprint_capacity_hours: 70  # per person per sprint: 10 days x 8h minus ~10% for meetings / review
sprints:
  - {title: Sprint 1, start: 2026-11-02, milestone: UAT1}
  - {title: Sprint 2, start: 2026-11-16, milestone: UAT1}
  - {title: Sprint 3, start: 2026-11-30, milestone: UAT2}
  - {title: Sprint 4, start: 2026-12-14, milestone: UAT2}
  - {title: Sprint 5, start: 2027-01-04, milestone: UAT3}  # 2026-12-28..2027-01-03 年末年始 break
  - {title: Sprint 6, start: 2027-01-18, milestone: UAT3}

epics:
  - id: E-02
    title: 入荷検品・受入判定
    stories:
      - id: E-02-S01
        title: 入荷検品記録
        screens: [SCR-014]
        tasks:
          - title: GS1-128 パーサー拡張（AI 11/15）と GTIN・SKU 照合、数量初期値の廃止
            layer: ui
            refs: [DLT-014-05, DLT-014-08, D-09]
            hours: 12
            ac:
              - AI 01/10/11/15/17 を読み取り、数量以外の項目を自動入力する
              - GTIN が明細の SKU と一致しない場合は入力エラーとする
              - 数量欄は空欄で開始し、予定数量はヒントとしてのみ表示する
          - title: 製造日（E13）入力と inbound_lines.mfg_source 追加、seed の製造日推定を廃止
            layer: db
            refs: [DLT-014-04, GAP-011]
            hours: 10
            ac:
              - 製造日の取得元（GS1-128 / ラベル / 手入力）が mfg_source に残る
              - seed / 移行でロット番号から製造日を推定しない
      - id: E-02-S02
        title: 入荷時温度帯照合
        screens: [SCR-014]
        tasks:
          - title: record_inspection を版付き温度帯ポリシー閾値（resolve_tzp_version）参照に変更
            layer: db
            refs: [DLT-014-01, GAP-001, ADR-0005]
            hours: 10
            depends: [E-13-S03]
            ac:
              - 閾値は測定時刻に有効な TZP 版から取得し、コード内定数を使わない
              - 有効な版がない場合は確定を阻止する
          - title: 温度帯不一致を blocked 判定に変更し rule_evaluation_events を記録（intent 付き API）
            layer: db
            refs: [DLT-014-02, DLT-014-03, ADR-0004]
            hours: 14
            depends: [E-08-S01]
            ac:
              - 帯域外の温度は警告ではなく blocked となり、確定できない
              - 判定ごとに rule_evaluation_events が 1 行記録される
      - id: E-02-S03
        title: 一時温度帯申請・承認
        screens: [SCR-016]
        tasks:
          - title: temp_zone_requests テーブルと申請・承認・取下げ RPC / route handler（zod）
            layer: db
            refs: [DLT-016-02, DLT-016-03, GAP-015, ADR-0002]
            hours: 20
            ac:
              - 申請者と承認者が同一の場合は DB で拒否する
              - 3 つの RPC は route handler（セッション → ロール → zod）経由のみで呼べる
          - title: evaluate_zone_match が有効な一時温度帯申請を参照し rule_refs に申請 ID を記録
            layer: db
            refs: [DLT-016-04, ADR-0004, ADR-0005]
            hours: 8
            ac:
              - 期限内・承認済みの申請だけが判定に反映される
          - title: SCR-016 画面（承認待ちキュー＋詳細の 2 カラム）
            layer: ui
            refs: [DLT-016-01, options/SCR-016 案A]
            hours: 20
            ac:
              - ApprovalPanel / BlockPanel を再利用し、ワイヤーフレーム案 A の状態をすべて表示する
          - title: 一時温度帯申請の期限切れジョブとタスク受信箱「一時温度帯 承認待ち」
            layer: batch
            refs: [DLT-016-05, F-098]
            hours: 10
            ac:
              - 期限切れの申請は自動で expired になり、判定に使われない
              - 承認者のタスク受信箱に承認待ち件数が表示される
      - id: E-02-S04
        title: 受入・拒否・保留数量と理由コード
        screens: [SCR-015]
        tasks:
          - title: submit_inbound_acceptance で問題行の受入数量 0 チェックと受入ステッパーのロック
            layer: db
            refs: [DLT-015-01, BR-TEMP-02]
            hours: 8
            ac:
              - 温度帯不一致・牛 9 桁の行は受入数量 > 0 で確定できない
          - title: 受入確定時の温度帯再評価と差異承認ロールの修正
            layer: db
            refs: [DLT-015-06, DLT-015-03, DLT-015-07, ADR-0004]
            hours: 10
            ac:
              - finalize_inbound_acceptance 内で evaluate_zone_match を再実行する
              - 承認依頼先に作成者を初期値として入れない
      - id: E-02-S05
        title: ロット・在庫ユニット生成
        screens: [SCR-015]
        tasks:
          - title: to-be ロット列（trace_status・米トレース項目分割・supplier_lot・received_at）と記録処理
            layer: db
            refs: [DLT-015-04, GAP-012, GAP-014]
            hours: 14
            ac:
              - lots.rice を rice_origin / rice_transaction_id に分割し、トレース用索引 IDX-03..06 を作成する
              - 牛 9 桁のロットは trace_status = business_review で作成される
          - title: ロットラベル印刷（タブレット用レイアウト）と印刷監査 API
            layer: ui
            refs: [DLT-015-02, D-09]
            hours: 16
            ac:
              - 受入確定時にロットラベルを印刷でき、印刷ごとに監査イベントが残る
      - id: E-02-S06
        title: 規制トレース項目の入力・検証
        screens: [SCR-014]
        tasks:
          - title: 米トレース項目（E18）入力と record_inspection の必須チェック
            layer: db
            refs: [DLT-014-06, BR-TRACE-01]
            hours: 10
            ac:
              - 米レーンの SKU は必須項目が欠けると確定できない
          - title: 牛個体識別番号の検証（9 桁 = 業務レビュー警告・ゼロ埋め禁止 / その他桁数 = 入力エラー）
            layer: db
            refs: [BR-TRACE-02, Q-new-18, PREMISE §4.6]
            hours: 8
            ac:
              - 9 桁は受け付けた値のまま記録し、ゼロ埋めしない
              - 9 桁・10 桁以外、または数字以外を含む場合は入力エラー
      - id: E-02-S07
        title: 検品不合格時の自動隔離
        screens: [SCR-015]
        tasks:
          - title: 受入から逸脱ケースを起票する際に deviation_case_lots を記録
            layer: db
            refs: [DLT-015-05, GAP-051]
            hours: 8
            ac:
              - 逸脱ケースと対象ロットが外部キーで結ばれる（ロット番号配列を使わない）

  - id: E-03
    title: ロット・在庫状態管理
    stories:
      - id: E-03-S01
        title: ロット状態遷移制御
        screens: [SCR-025]
        tasks:
          - title: lot_events の INSERT 専用トリガーと判定時の deviation_case_lots 更新
            layer: db
            refs: [DLT-025-04, GAP-067, ADR-0003]
            hours: 8
            ac:
              - lot_events への UPDATE / DELETE は DB で拒否される
      - id: E-03-S02
        title: 隔離・解除・廃棄判定
        screens: [SCR-025]
        tasks:
          - title: decide_quarantine で trace_status = business_review のロット解除を阻止（牛 9 桁）
            layer: db
            refs: [DLT-025-01, GAP-012]
            priority: P0
            hours: 8
            ac:
              - 10 桁の個体識別番号が確認されるまで解除できない
          - title: decide_quarantine で未クローズ回収ケース対象ロットの解除を blocked（廃棄は可）
            layer: db
            refs: [DLT-025-08, GAP-071, ADR-0004]
            priority: P0
            hours: 12
            ac:
              - 解除は blocked + rule_evaluation_events + 監査を残し、RAISE しない
              - 廃棄は回収ケース中でも実行できる
          - title: 隔離判定のエビデンス添付アップロード
            layer: api
            refs: [DLT-025-02, TBC-83]
            hours: 8
            depends: [E-24-S03]
            ac:
              - attachments（owner_type = lot_event）に保存され、判定イベントから参照できる
          - title: SCR-025 UI（2 カラム化・自動隔離ロット表示・回収 BlockPanel・文言・サーバー日付）
            layer: ui
            refs: [DLT-025-03, DLT-025-05, DLT-025-06, DLT-025-07]
            hours: 16
            ac:
              - アラーム起因の自動隔離ロットに理由と隔離時刻が表示される
              - 回収ケース中のロットは BlockPanel で解除不可の理由を示す

  - id: E-06
    title: 期限・引当ルール
    stories:
      - id: E-06-S02
        title: 配送ウィンドウ判定
        screens: [SCR-033]
        tasks:
          - title: 配送ウィンドウ判定 ④ に納品予定日を渡す（参照元の確定と TS / SQL 両方の修正）
            layer: db
            refs: [DLT-033-05, D-01, QA-021]
            hours: 8
            ac:
              - 判定は出荷日ではなく納品予定日で行う
              - 消費期限 SKU はハードストップ判定を先に行い、その後ウィンドウを判定する
      - id: E-06-S03
        title: 日付逆転禁止チェック
        screens: [SCR-034]
        tasks:
          - title: 日付逆転の比較基準を顧客×SKU 単位で DB 取得し、旧↔新顧客コード対応表で履歴を連結
            layer: db
            refs: [DLT-034-05, GAP-006, GAP-024, ADR-0006]
            hours: 12
            depends: [E-20-S02]
            ac:
              - 比較対象は同じ顧客×SKU の受領済み配送行のうち受領時刻が最新のもの（今日の日付とは比較しない）
              - 他の顧客の履歴は使わない。コード変更は承認済み対応表がある場合のみ連結する
          - title: POD 未同期・移行 BUSINESS_REVIEW 行の件数クエリ（SCR-034 警告用）
            layer: db
            refs: [DLT-034-04, Q-new-04, Q-new-05]
            hours: 8
            ac:
              - 顧客×SKU ごとに未同期 POD 件数と移行レビュー中件数を返す
      - id: E-06-S05
        title: 引当判定エビデンス表示
        screens: [SCR-034]
        tasks:
          - title: SCR-034 ローダーを rule_evaluation_events 参照に変更し、DB 結論・verdict_mismatch・ルール版を表示
            layer: ui
            refs: [DLT-034-01, DLT-034-02, DLT-034-08, ADR-0004, ADR-0005]
            hours: 16
            depends: [E-08-S01]
            ac:
              - 画面の結論は DB の評価結果を表示し、クライアント計算を使わない
              - 評価時のルール版が表示される
          - title: SCR-034 UI（期限種別カード分離・未設定ラベル統一・ROLE-010 閲覧）
            layer: ui
            refs: [DLT-034-07, DLT-034-09, DLT-034-10, GAP-010]
            hours: 8
            ac:
              - 賞味期限（警告）と消費期限（ハードストップ）が別表示で区別できる
      - id: E-06-S06
        title: 納品履歴（受領済み配送行）管理
        screens: [SCR-034, SCR-062]
        tasks:
          - title: delivery_outcome_events を追加し delivery_history の状態を同一トランザクションで更新
            layer: db
            refs: [DLT-034-03, GAP-023, ADR-0006, D-06]
            hours: 16
            ac:
              - 受領拒否・全量返品の行は比較対象から外れ、一部返品の行は残る
          - title: 配送完了時の日単位集約を廃止し POD 単位で重複を防止
            layer: db
            refs: [DLT-062-13, GAP-027]
            hours: 8
            ac:
              - 同日複数便は受領時刻の遅い方が比較基準になる

  - id: E-08
    title: 引当・ピッキング・積込
    stories:
      - id: E-08-S01
        title: 原子的引当
        screens: [SCR-033, SCR-034]
        tasks:
          - title: rule_evaluation_events テーブルと共通記録ヘルパー（blocked を返してイベントを確定、RAISE しない）
            layer: db
            refs: [GAP-022, DLT-033-03, ADR-0004]
            priority: P0
            hours: 12
            ac:
              - ハード制約に違反しても評価イベントはコミットされる
          - title: 引当制約チェック SQL 関数（① 消費期限 ② 温度帯 ③ トレース状態 ④ 配送ウィンドウ ⑤ 日付逆転）を commit_allocation_core 内で実行
            layer: db
            refs: [DLT-033-01, DLT-033-06, GAP-020, ADR-0004]
            priority: P0
            hours: 24
            ac:
              - 5 つの制約を同一トランザクション内で再検証し、比較基準 comparison_delivery_id を保存する
          - title: 契約版の参照（未設定 = 業務レビュー、D-02 承認なしは引当しない）とクライアント結論の受け取り廃止
            layer: db
            refs: [DLT-033-02, GAP-019, D-02]
            priority: P0
            hours: 12
            depends: [E-20-S02]
            ac:
              - AGR-008 / AGR-014 に既定ルール（1/3 等）を自動適用しない
          - title: lock_timeout と 409「混雑」マッピング、lots.qty_reserved と CHECK 制約
            layer: db
            refs: [DLT-033-07, GAP-026, GAP-013, ADR-0007]
            hours: 10
            ac:
              - 同一ロットへの同時引当で二重引当が発生しない
          - title: allocations にルール版キーと比較基準を追加し、業務レビュー承認時に制約を再チェック
            layer: db
            refs: [DLT-033-08, DLT-034-06, DLT-034-11, GAP-025]
            hours: 10
            ac:
              - decide_business_review は check_allocation_constraints を再実行する
              - 申請期限はシステム時刻で判定する
          - title: 引当データ読込を顧客×SKU 単位に変更し 300,000 出荷行で EXPLAIN 計測
            layer: db
            refs: [DLT-033-04, GAP-024, NFR-PERF-01]
            hours: 12
            ac:
              - 部分索引 IDX-01 を使う実行計画を確認し、計測結果を残す
          - title: 引当ハード制約の境界値テスト（消費期限当日・前日、同日複数便、未設定契約、同時引当）
            layer: test
            refs: [ADR-0004 Verification, ADR-0007 Verification]
            hours: 16
            ac:
              - 各制約で通過 / blocked の境界ケースが自動テストで確認される
          - tid: T-168  # added 2026-10-29 after Sprint 1 (NFR-PERF-01 load test was missed in the first breakdown)
            not_before: Sprint 2
            title: ステージングで 80 ユーザー同時の負荷テスト（引当・検品登録・トレース検索のシナリオ、p95 計測）
            layer: test
            refs: [NFR-PERF-01, PREMISE §4.5, ADR-0007]
            hours: 16
            ac:
              - 80 ユーザー同時で読取 p95 2 秒以内・書込 p95 3 秒以内を計測し、結果を残す（42 名に縮小しない）
              - 同時引当で二重引当・デッドロックが発生しないことを負荷中に確認する
      - id: E-08-S02
        title: ピッキングタスク生成
        screens: [SCR-033]
        tasks:
          - title: SCR-033 UI（要対応 3 パネル・業務レビュー申請期限カウントダウン・契約列・判定内訳展開行）
            layer: ui
            refs: [DLT-033-09, DLT-033-10, DLT-033-12, DLT-033-13]
            hours: 16
            ac:
              - 業務レビュー行に申請期限（出荷前日 15:00）までの残り時間が表示される
          - title: 「ピッキングタスクを生成」・CSV 出力ボタンと監査付き CSV エンドポイント
            layer: api
            refs: [DLT-033-11, NFR-AUD-01]
            hours: 10
            ac:
              - CSV 出力ごとに監査イベントが残る

  - id: E-09
    title: 出荷前検査・出荷確定
    stories:
      - id: E-09-S02
        title: 出荷確定・ディスパッチ
        screens: [SCR-033]
        tasks:
          - title: confirm_dispatch でロット取得後に消費期限・隔離・trace_status を再チェック
            layer: db
            refs: [GAP-021, DLT-033-06, ADR-0004]
            priority: P0
            hours: 12
            ac:
              - 引当後に期限切れ・隔離・トレース未確定となったロットは出荷確定できず、評価イベントが残る

  - id: E-10
    title: 配送完了（POD）・クレーム
    stories:
      - id: E-10-S01
        title: 配送完了記録（POD）
        screens: [SCR-062]
        tasks:
          - title: POD 記録を route_stops / route_stop_lines 参照に変更
            layer: db
            refs: [DLT-062-14, GAP-035]
            hours: 10
            depends: [E-12-S01]
            ac:
              - complete_delivery は版付きの停車地・明細テーブルから読む
          - title: 受取人氏名を pod_recipients に分離し、エビデンスチェック関数を更新
            layer: db
            refs: [DLT-062-07, GAP-041, D-15]
            hours: 8
            ac:
              - pods にはキーとハッシュのみを残し、氏名は 3 年保持の別表に置く
          - title: SCR-062 UI（ボトムナビ・離脱防止・タイトル・デモ要素削除）とルート所有者チェック
            layer: ui
