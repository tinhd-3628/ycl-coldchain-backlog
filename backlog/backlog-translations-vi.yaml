T-001:
  title: Mở rộng parser GS1-128 (AI 11/15), đối chiếu GTIN–SKU, bỏ giá trị số lượng mặc định
  ac:
    - Đọc AI 01/10/11/15/17 và tự điền mọi mục trừ số lượng
    - GTIN không khớp SKU của dòng chi tiết thì báo lỗi nhập
    - Ô số lượng bắt đầu để trống, số lượng dự kiến chỉ hiện làm gợi ý
T-002:
  title: Nhập ngày sản xuất (E13), thêm inbound_lines.mfg_source, bỏ suy ngày sản xuất trong seed
  ac:
    - Nguồn ngày sản xuất (GS1-128 / nhãn / nhập tay) được lưu ở mfg_source
    - Seed / migration không suy ngày sản xuất từ số lô
T-003:
  title: Đổi record_inspection sang dùng ngưỡng của chính sách dải nhiệt có phiên bản (resolve_tzp_version)
  ac:
    - Ngưỡng lấy từ phiên bản TZP có hiệu lực tại thời điểm đo, không dùng hằng số trong code
    - Không có phiên bản hiệu lực thì chặn xác nhận
T-004:
  title: Chuyển lệch dải nhiệt thành phán định blocked và ghi rule_evaluation_events (API có intent)
  ac:
    - Nhiệt độ ngoài dải bị blocked chứ không chỉ cảnh báo, không xác nhận được
    - Mỗi lần phán định ghi đúng 1 dòng rule_evaluation_events
T-005:
  title: Bảng temp_zone_requests và RPC / route handler (zod) cho tạo đơn, duyệt, rút đơn
  ac:
    - Người tạo đơn trùng người duyệt thì DB từ chối
    - 3 RPC chỉ gọi được qua route handler (session → vai trò → zod)
T-006:
  title: evaluate_zone_match tham chiếu đơn dải nhiệt tạm thời còn hiệu lực, ghi ID đơn vào rule_refs
  ac:
    - Chỉ đơn đã duyệt và còn hạn mới được dùng khi phán định
T-007:
  title: Màn SCR-016 (hàng đợi chờ duyệt + chi tiết, bố cục 2 cột)
  ac:
    - Dùng lại ApprovalPanel / BlockPanel, hiển thị đủ mọi trạng thái của wireframe phương án A
T-008:
  title: Job hết hạn đơn dải nhiệt tạm thời và hộp việc "chờ duyệt dải nhiệt tạm thời"
  ac:
    - Đơn quá hạn tự chuyển expired và không còn dùng để phán định
    - Hộp việc của người duyệt hiển thị số đơn đang chờ
T-009:
  title: submit_inbound_acceptance kiểm tra số lượng nhận = 0 ở dòng có vấn đề và khóa stepper tiếp nhận
  ac:
    - Dòng lệch dải nhiệt hoặc mã bò 9 số không xác nhận được nếu số lượng nhận > 0
T-010:
  title: Đánh giá lại dải nhiệt khi xác nhận tiếp nhận và sửa vai trò duyệt chênh lệch
  ac:
    - Chạy lại evaluate_zone_match bên trong finalize_inbound_acceptance
    - Không điền sẵn người tạo làm người được nhờ duyệt
T-011:
  title: Cột lô to-be (trace_status, tách mục truy xuất gạo, supplier_lot, received_at) và xử lý ghi
  ac:
    - Tách lots.rice thành rice_origin / rice_transaction_id, tạo index truy xuất IDX-03..06
    - Lô có mã bò 9 số được tạo với trace_status = business_review
T-012:
  title: In nhãn lô (bố cục cho tablet) và API kiểm toán việc in
  ac:
    - In được nhãn lô khi xác nhận tiếp nhận, mỗi lần in để lại sự kiện kiểm toán
T-013:
  title: Nhập mục truy xuất gạo (E18) và kiểm tra bắt buộc trong record_inspection
  ac:
    - SKU thuộc nhóm gạo thiếu mục bắt buộc thì không xác nhận được
T-014:
  title: Kiểm tra mã cá thể bò (9 số = cảnh báo xem xét nghiệp vụ, cấm đệm 0 / số chữ số khác = lỗi nhập)
  ac:
    - Mã 9 số được lưu nguyên giá trị đã nhận, không đệm số 0
    - Không phải 9 hoặc 10 số, hoặc có ký tự không phải số thì báo lỗi nhập
T-015:
  title: Ghi deviation_case_lots khi mở hồ sơ sai lệch từ màn tiếp nhận
  ac:
    - Hồ sơ sai lệch và lô liên quan nối bằng khóa ngoại (không dùng mảng số lô)
T-016:
  title: Trigger chỉ cho INSERT trên lot_events và cập nhật deviation_case_lots khi phán định
  ac:
    - DB từ chối UPDATE / DELETE trên lot_events
T-017:
  title: decide_quarantine chặn giải phóng lô có trace_status = business_review (bò 9 số)
  ac:
    - Chưa xác nhận được mã cá thể 10 số thì không giải phóng
T-018:
  title: decide_quarantine chặn (blocked) giải phóng lô thuộc hồ sơ thu hồi chưa đóng (vẫn cho hủy)
  ac:
    - Giải phóng trả về blocked kèm rule_evaluation_events và kiểm toán, không RAISE
    - Vẫn hủy bỏ được dù đang có hồ sơ thu hồi
T-019:
  title: Tải lên tệp bằng chứng kèm quyết định cách ly
  ac:
    - Lưu vào attachments (owner_type = lot_event), tham chiếu được từ sự kiện quyết định
T-020:
  title: UI SCR-025 (2 cột, lô tự cách ly, BlockPanel thu hồi, câu chữ, ngày theo server)
  ac:
    - Lô tự cách ly do cảnh báo nhiệt hiển thị lý do và giờ cách ly
    - Lô thuộc hồ sơ thu hồi hiển thị lý do không thể giải phóng trong BlockPanel
T-021:
  title: Truyền ngày giao dự kiến vào phán định cửa sổ giao ④ (chốt nguồn dữ liệu, sửa cả TS và SQL)
  ac:
    - Phán định theo ngày giao dự kiến, không theo ngày xuất
    - SKU có 消費期限 (hạn tiêu thụ an toàn) chạy phán định chặn cứng trước, rồi mới xét cửa sổ
T-022:
  title: Lấy mốc so sánh đảo ngược ngày từ DB theo cặp khách×SKU, nối lịch sử qua bảng đối chiếu mã khách cũ↔mới
  ac:
    - Mốc so sánh là dòng giao đã nhận có giờ nhận mới nhất của đúng cặp khách×SKU (không so với ngày hôm nay)
    - Không dùng lịch sử của khách khác; chỉ nối lịch sử khi có bảng đối chiếu mã đã duyệt
T-023:
  title: Query đếm POD chưa đồng bộ và dòng migration BUSINESS_REVIEW (cho cảnh báo SCR-034)
  ac:
    - Trả về số POD chưa đồng bộ và số dòng đang xem xét migration theo từng khách×SKU
T-024:
  title: Đổi loader SCR-034 sang đọc rule_evaluation_events, hiện kết luận DB, verdict_mismatch và phiên bản quy tắc
  ac:
    - Kết luận trên màn hình lấy từ kết quả đánh giá của DB, không tính ở client
    - Hiển thị phiên bản quy tắc dùng lúc đánh giá
T-025:
  title: UI SCR-034 (tách thẻ theo loại hạn, thống nhất nhãn "chưa thiết lập", quyền xem ROLE-010)
  ac:
    - 賞味期限 (hạn ngon nhất – cảnh báo) và 消費期限 (hạn an toàn – chặn cứng) hiển thị tách biệt
T-026:
  title: Thêm delivery_outcome_events, cập nhật trạng thái delivery_history trong cùng transaction
  ac:
    - Dòng bị từ chối nhận / trả toàn bộ bị loại khỏi mốc so sánh, dòng trả một phần vẫn giữ
T-027:
  title: Bỏ gộp theo ngày khi hoàn tất giao, chống trùng theo từng POD
  ac:
    - Cùng ngày nhiều chuyến thì chuyến có giờ nhận muộn hơn làm mốc so sánh
T-028:
  title: Bảng rule_evaluation_events và helper ghi chung (trả blocked và chốt sự kiện, không RAISE)
  ac:
    - Vi phạm ràng buộc cứng vẫn commit sự kiện đánh giá
T-029:
  title: Hàm SQL kiểm tra ràng buộc phân bổ (① 消費期限 ② dải nhiệt ③ trạng thái truy xuất ④ cửa sổ giao ⑤ đảo ngược ngày) chạy trong commit_allocation_core
  ac:
    - Kiểm lại đủ 5 ràng buộc trong cùng transaction và lưu mốc so sánh comparison_delivery_id
T-030:
  title: Tham chiếu phiên bản hợp đồng (chưa thiết lập = xem xét nghiệp vụ, chưa duyệt D-02 thì không phân bổ), bỏ nhận kết luận từ client
  ac:
    - Không tự áp quy tắc mặc định (1/3…) cho AGR-008 / AGR-014
T-031:
  title: lock_timeout và ánh xạ 409 "đang bận", lots.qty_reserved và ràng buộc CHECK
  ac:
    - Phân bổ đồng thời vào cùng lô không gây phân bổ trùng
T-032:
  title: Thêm khóa phiên bản quy tắc và mốc so sánh vào allocations, kiểm lại ràng buộc khi duyệt xem xét nghiệp vụ
  ac:
    - decide_business_review chạy lại check_allocation_constraints
    - Hạn nộp đơn được tính theo giờ hệ thống
T-033:
  title: Đọc dữ liệu phân bổ theo khách×SKU và đo EXPLAIN với 300,000 dòng xuất
  ac:
    - Xác nhận execution plan dùng partial index IDX-01 và lưu kết quả đo
T-034:
  title: Test giá trị biên ràng buộc cứng phân bổ (đúng ngày / trước 1 ngày 消費期限, nhiều chuyến cùng ngày, hợp đồng chưa thiết lập, phân bổ đồng thời)
  ac:
    - Test tự động xác nhận các ca biên qua / blocked của từng ràng buộc
T-035:
  title: UI SCR-033 (3 panel cần xử lý, đếm ngược hạn nộp xem xét nghiệp vụ, cột hợp đồng, dòng mở rộng chi tiết phán định)
  ac:
    - Dòng xem xét nghiệp vụ hiện thời gian còn lại đến hạn nộp (15:00 ngày trước ngày xuất)
T-036:
  title: Nút "Tạo task lấy hàng", xuất CSV và endpoint CSV có kiểm toán
  ac:
    - Mỗi lần xuất CSV để lại sự kiện kiểm toán
T-037:
  title: confirm_dispatch kiểm lại 消費期限, cách ly, trace_status sau khi lấy lô
  ac:
    - Lô đã hết hạn, bị cách ly hoặc chưa xác định truy xuất sau khi phân bổ thì không xác nhận xuất được và có sự kiện đánh giá
T-038:
  title: Đổi ghi POD sang tham chiếu route_stops / route_stop_lines
  ac:
    - complete_delivery đọc từ bảng điểm dừng / chi tiết có phiên bản
T-039:
  title: Tách tên người nhận sang pod_recipients, cập nhật hàm kiểm tra bằng chứng
  ac:
    - pods chỉ giữ khóa và hash, tên người nhận nằm ở bảng riêng lưu 3 năm
T-040:
  title: UI SCR-062 (thanh điều hướng dưới, chống rời trang, tiêu đề, bỏ phần demo) và kiểm tra chủ tuyến
  ac:
    - Tài xế không phụ trách thì không đọc được tuyến, cả trên màn hình lẫn RLS
T-041:
  title: Danh sách mã ngoại lệ, bộ bằng chứng bắt buộc (gồm ảnh nhiệt kế EX-05), bằng chứng POD bắt buộc theo hợp đồng
  ac:
    - Bằng chứng bắt buộc theo hình thức giao trên xe / giao tận cửa và theo mã ngoại lệ được quyết định từ phiên bản hợp đồng
T-042:
  title: Lấy ngưỡng nhiệt thùng xe từ chính sách dải nhiệt có phiên bản
  ac:
    - Chuyến lạnh / đông có nhiệt độ lúc đến ngoài dải thì bắt buộc EX-05 và ảnh
T-043:
  title: Server đối chiếu vị trí thiết bị với geofence điểm giao (ngoài vùng = cảnh báo + gắn cờ cho điều phối)
  ac:
    - Chỉ dùng vị trí tại thời điểm lấy POD, không lưu địa chỉ hay GPS liên tục
    - Ngoài vùng hoặc không rõ vị trí vẫn hoàn tất được, location_match và cờ được lưu lại
T-044:
  title: Hàng đợi mã hóa trên PWA (Service Worker + IndexedDB, AES-GCM), bỏ công tắc Cookie
  ac:
    - POD lúc ngoại tuyến được mã hóa lưu trên máy, không còn bản rõ
T-045:
  title: Cache ngoại tuyến gói lịch chạy đã công bố (mở được SCR-062 khi mất mạng)
  ac:
    - Ở chế độ máy bay vẫn mở được lịch chạy trong ngày và SCR-062
T-046:
  title: pods.client_pod_id (UNIQUE) + content_sha256 và RPC nhận hàng loạt idempotent
  ac:
    - Gửi lại cùng POD chỉ ghi 1 bản và trả lại kết quả lần trước
T-047:
  title: Tự đồng bộ (khi có mạng lại / khi mở app), sửa thông báo hoàn tất, giới hạn hàng đợi cảnh báo 6h / 8h
  ac:
    - Chưa đồng bộ 6 giờ thì cảnh báo, 8 giờ thì báo chạm giới hạn
T-048:
  title: Gắn với thiết bị đã đăng ký, từ chối đồng bộ bản ghi của tài xế khác
  ac:
    - Bản ghi không phải của tài xế đang đăng nhập bị từ chối khi đồng bộ
T-049:
  title: Lưu ảnh và chữ ký vào attachments (server tính lại SHA-256, lưu 3 năm)
  ac:
    - Tệp lệch hash bị từ chối, ảnh không được ghi ra log
T-050:
  title: Tạo private.check_route_driver_hours() (tính lại trong DB khi công bố tuyến)
  ac:
